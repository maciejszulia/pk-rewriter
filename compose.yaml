services:
  ollama:
    image: ollama/ollama:0.34.1
    volumes:
      - ollama:/root/.ollama
  app:
    build: .
    image: ghcr.io/maciejszulia/pk-rewriter:latest
    environment:
      OLLAMA_URL: http://ollama:11434
      PK_MODELS: qwen3.5:4b,qwen3.5:2b,qwen3.5:0.8b
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - ollama

volumes:
  ollama:
