[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pk-rewriter"
version = "0.1.0"
description = "A local Qwen model rewrites Polish text into Controlled Polish (PK); a linter checks every result."
readme = "README.md"
license = "MIT"
authors = [{ name = "Maciej Szulia" }]
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["httpx>=0.27"]
eval = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["pk_rewriter"]
